<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — FootPredict CI</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:720px;margin:auto;padding:28px 18px}.card{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #0001}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px}button{background:#087f5b;color:#fff;border:0;padding:12px 18px;border-radius:9px;font-weight:bold;cursor:pointer}.error{color:#a22}.ok{color:#087f5b}#app{display:none}</style></head><body><div class="wrap"><h1>⚙️ Administration</h1><div id="loginBox" class="card"><h2>Connexion</h2><input id="username" autocomplete="username" placeholder="Nom d'utilisateur"><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe"><button type="button" onclick="adminLogin()">Se connecter</button><p id="loginMessage"></p></div><div id="app"><div class="card"><h2>Publier un pronostic</h2><input id="match" placeholder="Match, ex. PSG - Marseille"><input id="league" placeholder="Championnat"><input id="date" type="date"><input id="time" type="time"><input id="pick" placeholder="Pronostic, ex. Victoire PSG"><input id="odds" placeholder="Cote (facultatif)"><textarea id="analysis" placeholder="Analyse (facultatif)"></textarea><button type="button" onclick="publishPrediction()">Publier</button><p id="publishMessage"></p></div><div class="card"><h2>Pronostics publiés</h2><div id="list">Chargement...</div></div></div></div><script>
let authToken='';
const $=id=>document.getElementById(id);
async function adminLogin(){
  const message=$('loginMessage'); message.textContent='Connexion en cours...'; message.className='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});
    const d=await r.json();
    if(!r.ok || !d.token){message.textContent=d.error||'Identifiants incorrects';message.className='error';return;}
    authToken=d.token; $('loginBox').style.display='none'; $('app').style.display='block'; message.textContent=''; loadPredictions();
  }catch(e){message.textContent='Impossible de contacter le serveur. Réessayez.';message.className='error';}
}
async function publishPrediction(){
  const message=$('publishMessage');
  const body={match:$('match').value.trim(),league:$('league').value.trim(),date:$('date').value,time:$('time').value,pick:$('pick').value.trim(),odds:$('odds').value.trim(),analysis:$('analysis').value.trim()};
  if(!body.match||!body.pick){message.textContent='Renseignez le match et le pronostic.';message.className='error';return;}
  try{const r=await fetch('/api/predictions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+authToken},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){message.textContent=d.error||'Erreur de publication';message.className='error';return}message.textContent='Pronostic publié !';message.className='ok';['match','league','date','time','pick','odds','analysis'].forEach(id=>$(id).value='');loadPredictions()}catch(e){message.textContent='Erreur de connexion.';message.className='error'}
}
async function loadPredictions(){try{const r=await fetch('/api/predictions',{headers:{Authorization:'Bearer '+authToken}});const ps=await r.json();$('list').innerHTML=ps.map(p=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${esc(p.match)}</b><br><small>${esc(p.league||'')} ${esc(p.date||'')} ${esc(p.time||'')}</small><br>Pronostic : <b>${esc(p.pick||'')}</b> <button type="button" onclick="deletePrediction('${p.id}')">Supprimer</button></div>`).join('')||'Aucun pronostic publié.'}catch(e){$('list').textContent='Impossible de charger les pronostics.'}}
async function deletePrediction(id){if(!confirm('Supprimer ce pronostic ?'))return;await fetch('/api/predictions/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+authToken}});loadPredictions()}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}
</script></body></html>
