<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — FootPredict CI</title><style>body{font-family:Arial;margin:0;background:#f4f7fb}.wrap{max-width:720px;margin:auto;padding:28px 18px}.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #0001}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px}button{background:#087f5b;color:#fff;border:0;padding:12px 18px;border-radius:9px;font-weight:bold}#app{display:none}</style></head><body><div class="wrap"><h1>⚙️ Administration</h1><div id="login" class="card"><h2>Connexion</h2><input id="u" placeholder="Nom d'utilisateur"><input id="p" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><p id="lm"></p></div><div id="app"><div class="card"><h2>Publier un pronostic</h2><input id="match" placeholder="Match, ex. PSG - Marseille"><input id="league" placeholder="Championnat"><input id="date" type="date"><input id="time" type="time"><input id="pick" placeholder="Pronostic, ex. Victoire PSG"><input id="odds" placeholder="Cote (facultatif)"><textarea id="analysis" placeholder="Analyse (facultatif)"></textarea><button onclick="publish()">Publier</button><p id="pm"></p></div><div class="card"><h2>Pronostics publiés</h2><div id="list"></div></div></div></div><script>let token='';function login(){fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})}).then(r=>r.json()).then(d=>{if(d.token){token=d.token;login.style.display='none';app.style.display='block';load()}else lm.textContent=d.error||'Erreur'})}function publish(){const body={match:match.value,league:league.value,date:date.value,time:time.value,pick:pick.value,odds:odds.value,analysis:analysis.value};fetch('/api/predictions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)}).then(r=>r.json()).then(d=>{pm.textContent=d.error||'Pronostic publié !';load()})}function load(){fetch('/api/predictions').then(r=>r.json()).then(ps=>list.innerHTML=ps.map(p=>`<p><b>${p.match}</b> — ${p.pick} <button onclick="del('${p.id}')">Supprimer</button></p>`).join('')||'Aucun pronostic.')}function del(id){fetch('/api/predictions/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}}).then(load)}</script></body></html>
