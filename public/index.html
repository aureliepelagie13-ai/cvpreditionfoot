<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FootPredict CI — Pronostics</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:720px;margin:auto;padding:28px 18px}.card{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #0001}h1{margin:0 0 8px}button{border:0;border-radius:10px;padding:13px 18px;background:#087f5b;color:#fff;font-weight:700;cursor:pointer}.price{font-size:28px;font-weight:800}.locked{background:#fff8e6}.muted{color:#667085}.pick{font-size:20px;font-weight:800}</style></head><body><div class="wrap"><h1>⚽ FootPredict CI</h1><p class="muted">Les pronostics du jour — accès à 500 FCFA.</p><div class="card locked"><div class="price">500 FCFA / jour</div><p>Paye via Wave pour débloquer les pronostics publiés aujourd’hui.</p><button id="pay">Payer avec Wave</button><p id="msg" class="muted"></p></div><div id="predictions"><div class="card"><strong>🔒 Pronostics verrouillés</strong><p>Le contenu apparaît après confirmation du paiement.</p></div></div></div><script>const paid=sessionStorage.getItem('paid')==='1';async function load(){const r=await fetch('/api/predictions');const ps=await r.json();const box=document.getElementById('predictions');if(!paid){box.innerHTML='<div class="card"><strong>🔒 Accès payant</strong><p>Effectuez le paiement de 500 FCFA pour voir les pronostics.</p></div>';return}box.innerHTML=ps.length?ps.map(p=>`<div class="card"><h3>${p.match}</h3><div class="muted">${p.league||''} ${p.date||''} ${p.time||''}</div><p class="pick">Pronostic : ${p.pick}</p>${p.odds?`<p>Cote : ${p.odds}</p>`:''}<p>${p.analysis||''}</p></div>`).join(''):'<div class="card">Aucun pronostic publié pour le moment.</div>'}document.getElementById('pay').onclick=async()=>{const m=document.getElementById('msg');m.textContent='Création du paiement…';try{const r=await fetch('/api/create-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();if(!r.ok||!d.url){m.textContent=d.error||'Paiement indisponible.';return}location.href=d.url}catch(e){m.textContent='Impossible de contacter le service de paiement.'}};load();</script></body></html>
