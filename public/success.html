<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paiement — FootPredict CI</title><style>body{font-family:Arial;background:#f4f7fb;margin:0}.wrap{max-width:600px;margin:70px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 5px 20px #0001;text-align:center}button{background:#087f5b;color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><h1 id="title">Vérification du paiement…</h1><p id="msg">Nous vérifions votre paiement Wave.</p><button id="go" style="display:none" onclick="location.href='/'">Voir mes pronostics</button></div></div><script>(async()=>{const ref=new URLSearchParams(location.search).get('ref');const msg=document.getElementById('msg');if(!ref){document.getElementById('title').textContent='Référence manquante';msg.textContent='Impossible de vérifier ce paiement.';return}try{const r=await fetch('/api/verify-payment?ref='+encodeURIComponent(ref));const d=await r.json();if(d.paid){sessionStorage.setItem('premium_token',d.token);document.getElementById('title').textContent='Paiement confirmé ✅';msg.textContent='Votre accès premium est ouvert pour 24 heures.';document.getElementById('go').style.display='inline-block'}else{document.getElementById('title').textContent='Paiement non confirmé';msg.textContent='Le paiement n’est pas encore confirmé. Réessayez dans quelques secondes.';setTimeout(()=>location.reload(),5000)}}catch(e){document.getElementById('title').textContent='Erreur';msg.textContent='Impossible de contacter le serveur.'}})();</script></body></html>
